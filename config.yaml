# ==============================================================================
# 智能体配置文件
# ==============================================================================

# 模型配置
model:
  # API密钥
  api_key: 9a11d204-c61c-4931-b5e7-e1760f297e6f
  
  # API基础URL
  # Kimi K2 Thinking 使用 OpenAI 兼容接口
  # Kimi K2 Thinking 使用 OpenAI 兼容接口
  base_url: https://ark.cn-beijing.volces.com/api/v3
  
  # 模型名称
  main_model_name: ep-20251127172248-rqsjm   # Kimi K2 Thinking
  
# 温度参数
  temperature: 0.7 
  
  # 最大token数
  max_tokens: 262144
  
  # 请求超时（秒）
  timeout: 480                                                                                

# 智能体配置
agent:
  # 最大迭代次数
  # 防止无限循环
  max_iterations: 300
  
  # 智能体工作区目录
  # 智能体将在此目录中生成中间文件、脚本等
  workspace: "./workspace"

# 工具配置
tools:
  # Shell命令工具
  shell_tool:
    # 安全策略
    # allow_all: 允许所有命令（危险）
    # deny_all: 禁止所有命令
    # whitelist: 只允许白名单命令
    policy: whitelist
    # 白名单命令前缀
    whitelist:
      - "echo"
      - "ls"
      - "dir"
      - "cat"
      - "type"
      - "pwd"
      - "cd"
      - "head"
      - "tail"
      - "grep"
      - "find"
      - "where"
      - "which"
      - "python"
      - "pip"
      - "node"
      - "npm"
      - "git"
      - "curl"
      - "wget"
    # 执行超时（秒）
    timeout: 30
  
  # 文件操作工具
  file_tool:
    # 允许访问的目录
    allowed_directories:
      - "."
      - "./workspace"
      - "./outputs"
      - "./src"
      - "./docs"
      - "./scripts"
      - "./dataset"
  
  # Python代码执行工具
  code_executor:
    # 执行超时（秒）
    timeout: 30
  
  # 搜索工具
  search_tool:
    enabled: true
    # 搜索API配置
    api_key: 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
    engine: tavily

# 日志配置
logging:
  # 日志级别
  # DEBUG、INFO、WARNING、ERROR、CRITICAL
  level: "INFO"
  
  # 日志文件路径
  file_path: "outputs/logs/agent.log"
  
  # 是否输出到控制台
  console_output: true
  

# 内存配置
memory:
  # 最大记忆条数
  max_entries: 100
  
  # 记忆类型
  # buffer: 简单缓冲, summary: 摘要记忆
  type: "buffer"
